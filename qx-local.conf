# ============================================================
# 联通 CK 提取 —— 本地配置版（不经过「引用资源」，最稳）
# ============================================================
# 为什么用这个：引用资源要经过「下载 → 解析 → 启用」三道关，
# 任何一道出问题都表现为「没反应」，且不报错。本地配置没有这些环节。
#
# ── 步骤 ──────────────────────────────────────────────────
# 1. 把 unicom.js 用「文件」App 拷到：
#      我的 iPhone → Quantumult X → Scripts
#    文件名保持 unicom.js，不要改。
#
# 2. QX → 配置 → 当前配置右边的 ⓘ → 编辑
#    把下面的规则合并进对应段落（不要整段覆盖，是「合并」）
#
# 3. 保存 → QX 会重新加载配置
#
# 4. 退出联通 App 登录，重新走一次短信验证码登录
# ============================================================


# ── 段 1：加到你的 [rewrite_local] 段里 ──────────────────
#
# 请求阶段：抓 appId / deviceId
^https:\/\/m\.client\.10010\.com\/mobileService\/radomLogin\.htm url script-request-body unicom.js
^https:\/\/m\.client\.10010\.com\/mobileService\/sendRadomNum\.htm url script-request-body unicom.js
#
# 响应阶段：解析 token_online / ecs_token
^https:\/\/m\.client\.10010\.com\/mobileService\/radomLogin\.htm url script-response-body unicom.js


# ── 段 2：加到你的 [mitm] 段里 ───────────────────────────
#
# 把 m.client.10010.com 追加到 hostname 列表末尾，例如：
#   hostname = %APPEND% 已有的域名1, 已有的域名2, m.client.10010.com
#
# 注意：
#   · 不要重复写 hostname = 这行，只往现有那行后面加
#   · 本地配置里 %APPEND% 可有可无，但保留更安全（不会顶掉别的）


# ============================================================
# 排障：仍然没反应时，按这个顺序确认
# ============================================================
# ① QX → 设置 → MitM → 「MitM」总开关打开
# ② 同页确认证书已生成、已安装
# ③ iOS 设置 → 通用 → VPN与设备管理 → 有 Quantumult X 描述文件
# ④ iOS 设置 → 通用 → 关于本机 → 证书信任设置 → QX 证书开关打开
#    ← 装描述文件 ≠ 信任证书，这步最容易漏
# ⑤ QX → 日志 → 用 Safari 访问下面这个地址，看日志里有没有出现：
#      https://m.client.10010.com/mobileService/radomLogin.htm
#    有记录 = QX 在处理这条流量
#    没记录 = QX 没接管这条流量（代理没开 / 分流规则把它放直连了）
#
# 验证 MITM 是否生效（不依赖通知）：
#   把这条临时加进 [rewrite_local]，然后 Safari 访问上面的地址
#      ^https?:\/\/m\.client\.10010\.com\/ url script-response-body probe.js
#   · 页面变成 "QX-MITM-OK …"  → MITM 生效
#   · 还是 {"code":"0001",...}  → MITM 没生效，回到 ①-④
